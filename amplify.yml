version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20 && nvm use 20
        - node -v
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
